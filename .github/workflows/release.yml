name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.0.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release configuration and stamp build numbers
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$UPDATE_PRIVATE_KEY" ]] || { echo 'Set SPARKLE_PRIVATE_KEY before publishing'; exit 1; }
          build=$((22 + GITHUB_RUN_NUMBER))
          for plist in App/Info.plist FinderExtension/Info.plist; do
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Version in $plist does not match $RELEASE_TAG"; exit 1; }
          done
          for plist in App/Info.plist FinderExtension/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
          done
      - name: Import optional Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          [[ -n "$CERTIFICATE_P12$SIGNING_IDENTITY" ]] || exit 0
          [[ -n "$CERTIFICATE_P12" && -n "$SIGNING_IDENTITY" && -n "$NOTARY_KEY_P8" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]] || {
            echo 'Configure the Developer ID certificate, signing identity and notarization credentials'
            exit 1
          }
          umask 077
          keychain="$RUNNER_TEMP/rightmouse-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/rightmouse-certificate.p12"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/rightmouse-notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/rightmouse-certificate.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf 'CODESIGN_IDENTITY=%s\nNOTARY_KEY_PATH=%s\n' "$SIGNING_IDENTITY" "$RUNNER_TEMP/rightmouse-notary.p8" >> "$GITHUB_ENV"
      - name: Build, verify and package universal app
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          ./scripts/build-release.sh
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            xcrun stapler validate .build/release/Build/Products/Release/RightMouse.app
          fi
      - name: Sign the update and generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/create-appcast.py
      - name: Generate Homebrew cask
        run: |
          python3 scripts/create-cask.py "dist/RightMouse-${RELEASE_TAG#v}-universal.zip" > dist/rightmouse.rb
          ruby -c dist/rightmouse.rb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          archive="RightMouse-${RELEASE_TAG#v}-universal.zip"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" SHA256SUMS.txt appcast.xml rightmouse.rb --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$archive" SHA256SUMS.txt appcast.xml rightmouse.rb \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --title "RightMouse ${RELEASE_TAG#v}"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Clean signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rightmouse-certificate.p12" "$RUNNER_TEMP/rightmouse-notary.p8"
          keychain="$RUNNER_TEMP/rightmouse-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "Skipping Homebrew update because $latest is the latest release."
            exit 0
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern rightmouse.rb --dir "$RUNNER_TEMP/homebrew"
          mkdir -p Casks
          cp "$RUNNER_TEMP/homebrew/rightmouse.rb" Casks/rightmouse.rb
          ruby -c Casks/rightmouse.rb
          git add Casks/rightmouse.rb
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update RightMouse Homebrew cask for $RELEASE_TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
