name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set release build number in both Info.plist files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build=$((22 + GITHUB_RUN_NUMBER))
          for plist in App/Info.plist FinderExtension/Info.plist; do
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Version in $plist does not match $RELEASE_TAG"; exit 1; }
          done
          for plist in App/Info.plist FinderExtension/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
          done
      - name: Build universal app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Sign the update and generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/create-appcast.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "RightMouse-${RELEASE_TAG#v}-universal.zip" SHA256SUMS.txt appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --title "RightMouse ${RELEASE_TAG#v}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "Skipping Homebrew update because $latest is the latest release."
            exit 0
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p Casks
          python3 scripts/create-cask.py "dist/RightMouse-${RELEASE_TAG#v}-universal.zip" > Casks/rightmouse.rb
          ruby -c Casks/rightmouse.rb
          git add Casks/rightmouse.rb
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Update RightMouse Homebrew cask for $RELEASE_TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
